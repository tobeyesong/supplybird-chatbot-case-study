<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ModHaus lead forms</title>
  </head>
  <body>
    <form name="modhaus-chat" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="modhaus-chat" />
      <input name="bot-field" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
      <input name="source" />
    </form>
  </body>
</html>
